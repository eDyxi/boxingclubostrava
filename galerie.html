<script>
// Galerie: filtr (pilulky) a nahled pres celou obrazovku - sipky, Esc, swipe.
(function(){
  var figs=[].slice.call(document.querySelectorAll('.gal-grid figure')),
      lb=document.querySelector('.lb'), img=lb.querySelector('img'), cap=lb.querySelector('figcaption'), cur=0;
  var orbit=document.querySelector('.orbit'), orb=orbit.querySelector('.orb'), hint=document.querySelector('.gal-hint'),
      btns=[].slice.call(orbit.querySelectorAll('button'));
  function pick(f){
    btns.forEach(function(x){x.setAttribute('aria-pressed',x.dataset.f===f?'true':'false');});
    hint.classList.add('gone'); var n=0;
    figs.forEach(function(fi){
      var on=(f==='*'||fi.dataset.c===f);
      fi.classList.remove('in'); fi.classList.toggle('hide',!on);
      if(on){ fi.style.setProperty('--d',(n++*55)+'ms'); void fi.offsetWidth; fi.classList.add('in'); }
    });
    layout();
  }
  // Zarovnane rady: vybrane fotky se rozdeli do vyrovnanych rad (podle soucetu pomeru
  // stran) a kazda rada se dopocita presne na sirku mrizky - vsechny konci vpravo.
  var grid=document.querySelector('.gal-grid'), GAP=12;
  function layout(){
    // Rady se plni zleva doprava pri cilove vysce H. Plna rada se dopocita presne na
    // sirku mrizky; neuplna posledni rada zustane v cilove vysce zarovnana vlevo
    // (zadna osamela roztazena fotka).
    var v=vis(); if(!v.length) return;
    var W=grid.clientWidth, H=innerWidth<700?150:230;
    var r=v.map(function(f){return parseFloat(f.style.getPropertyValue('--r'))||1.5;});
    var row=[], sum=0;
    function flush(full){
      var h=full?(W-GAP*(row.length-1))/sum:H;
      row.forEach(function(j,q){ v[j].style.width=Math.floor(r[j]*h)+'px'; v[j].style.height=Math.round(h)+'px';
        v[j].style.flexGrow=(full&&q===row.length-1)?'1':'0'; });
      row=[]; sum=0;
    }
    for(var i=0;i<v.length;i++){
      row.push(i); sum+=r[i];
      if(v.length>6&&sum*H+GAP*(row.length-1)>=W) flush(true);
    }
    if(row.length) flush(v.length<=6||sum*H+GAP*(row.length-1)>=W*.8);   // malou sadu vzdy do jedne plne rady
  }
  var rt; addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(layout,120); });
  orb.addEventListener('click',function(){
    var o=!orbit.classList.contains('open'); orbit.classList.toggle('open',o); orb.setAttribute('aria-expanded',o?'true':'false');
    if(o){ pick('*'); return; }
    // druhy klik: drahu zavre a fotky schova
    btns.forEach(function(x){x.setAttribute('aria-pressed','false');});
    figs.forEach(function(fi){fi.classList.remove('in'); fi.classList.add('hide');});
    hint.classList.remove('gone');
  });
  orbit.querySelectorAll('.sat').forEach(function(s){ s.addEventListener('click',function(){ pick(s.dataset.f); }); });
  function vis(){return figs.filter(function(f){return !f.classList.contains('hide');});}
  function show(f){
    var v=vis(); cur=v.indexOf(f); img.src=f.dataset.full; img.alt=f.querySelector('img').alt;
    cap.textContent=f.querySelector('figcaption').textContent;
    lb.classList.add('on'); lb.setAttribute('aria-hidden','false'); document.documentElement.classList.add('lb-open');
  }
  function step(d){var v=vis(); if(!v.length) return; cur=(cur+d+v.length)%v.length; show(v[cur]);}
  function close(){lb.classList.remove('on'); lb.setAttribute('aria-hidden','true'); document.documentElement.classList.remove('lb-open');}
  figs.forEach(function(f){
    f.addEventListener('click',function(){show(f);});
    f.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show(f);}});
  });
  lb.querySelector('.lb-x').addEventListener('click',close);
  lb.querySelector('.lb-p').addEventListener('click',function(e){e.stopPropagation();step(-1);});
  lb.querySelector('.lb-n').addEventListener('click',function(e){e.stopPropagation();step(1);});
  lb.addEventListener('click',function(e){if(e.target===lb) close();});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on')) return;
    if(e.key==='Escape') close(); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1);
  });
  var sx=null;
  lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){if(sx===null)return; var d=e.changedTouches[0].clientX-sx; if(Math.abs(d)>50) step(d<0?1:-1); sx=null;});
})();
</script>
